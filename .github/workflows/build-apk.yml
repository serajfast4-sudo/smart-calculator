name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Generate Project Files and Build APK
        run: |
          # 1. Create required project directories
          mkdir -p app/src/main/java/com/smartcalculator/app
          mkdir -p app/src/main/assets

          # 2. Automatically find and map your .html file
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" app/src/main/assets/index.html
            echo "Successfully mapped HTML source: $HTML_FILE"
          else
            echo "<html><body><h1>Calculator App</h1></body></html>" > app/src/main/assets/index.html
            echo "Warning: No .html file found, using default stub."
          fi

          # 3. Map App Icon (Optional)
          ICON_FILE=$(find . -maxdepth 1 -iname "icon.svg" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            mkdir -p app/src/main/res/drawable
            cp "$ICON_FILE" app/src/main/res/drawable/icon.svg
          fi

          # 4. Write MainActivity.java with local WebView permissions
          cat << 'EOF' > app/src/main/java/com/smartcalculator/app/MainActivity.java
          package com.smartcalculator.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # 5. Write AndroidManifest.xml (AGP 8+ compliant)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Smart Calculator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Write Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 7. Write App-level build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdk 34
              namespace 'com.smartcalculator.app'

              defaultConfig {
                  applicationId "com.smartcalculator.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 8. Write settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # 9. Download and use standalone Gradle 8.4 binary
          echo "Downloading Gradle 8.4..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH="$PWD/gradle-8.4/bin:$PATH"

          # 10. Compile APK
          echo "Executing Gradle build..."
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
