name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Webview Project & Pin Gradle 8.4
        run: |
          mkdir -p app/src/main/java/com/smartcalculator/app
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper

          # 1. Manually write wrapper properties (No system Gradle execution needed)
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 2. Map HTML source file
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f Calculator.html ]; then
            cp Calculator.html app/src/main/assets/index.html
          elif [ -f Calculator ]; then
            cp Calculator app/src/main/assets/index.html
          else
            echo "<html><body><h1>Calculator App</h1></body></html>" > app/src/main/assets/index.html
          fi

          # 3. Map App Icon
          ICON_FILE=$(find . -maxdepth 1 -iname "icon.svg" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            mkdir -p app/src/main/res/drawable
            cp "$ICON_FILE" app/src/main/res/drawable/icon.svg
          fi

          # 4. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/smartcalculator/app/MainActivity.java
          package com.smartcalculator.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);

                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.smartcalculator.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Smart Calculator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 7. App build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdk 34
              namespace 'com.smartcalculator.app'

              defaultConfig {
                  applicationId "com.smartcalculator.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 8. Settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

      - name: Build Debug APK directly with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
