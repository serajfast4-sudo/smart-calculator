name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bootstrap Pinned Gradle Wrapper
        run: |
          # Create temporary empty build file so system Gradle doesn't complain during wrapper setup
          touch build.gradle
          gradle wrapper --gradle-version 8.4
          rm build.gradle

      - name: Create Native Webview App
        run: |
          mkdir -p app/src/main/java/com/smartcalculator/app
          mkdir -p app/src/main/assets

          # Map HTML
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f Calculator.html ]; then
            cp Calculator.html app/src/main/assets/index.html
          elif [ -f Calculator ]; then
            cp Calculator app/src/main/assets/index.html
          else
            echo "<html><body><h1>Calculator App</h1></body></html>" > app/src/main/assets/index.html
          fi

          # App Icon
          ICON_FILE=$(find . -maxdepth 1 -iname "icon.svg" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            mkdir -p app/src/main/res/drawable
            cp "$ICON_FILE" app/src/main/res/drawable/icon.svg
          fi

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/smartcalculator/app/MainActivity.java
          package com.smartcalculator.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);

                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.smartcalculator.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Smart Calculator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdk 34
              namespace 'com.smartcalculator.app'

              defaultConfig {
                  applicationId "com.smartcalculator.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

      - name: Build Debug APK via Pinned Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
