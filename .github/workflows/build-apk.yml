name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Embedded APK
        run: |
          # 1. Create fresh project
          cordova create build_tmp com.smartcalculator.app SmartCalculator
          cd build_tmp
          
          # 2. Clear default template files
          rm -rf www/*
          
          # 3. Copy repo contents directly into www
          cp -r ../* www/ 2>/dev/null || true
          
          # 4. Enforce proper offline local file loading in config.xml
          sed -i 's|<content src="index.html" />|<content src="index.html" /><preference name="allowHrefSameOrigin" value="*"/><preference name="AndroidInsecureFileModeEnabled" value="true"/>|g' config.xml
          
          # 5. Build Android platform locally
          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
