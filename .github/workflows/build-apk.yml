name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install SVG converter
        run: sudo apt-get install -y librsvg2-bin

      - name: Generate Project Files and Build APK
        run: |
          mkdir -p app/src/main/java/com/smartcalculator/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi \
                   app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi \
                   app/src/main/res/mipmap-xxxhdpi

          # Find the calculator source: prefer *.html, fall back to a file literally named "Calculator"
          HTML_FILE=$(find . -maxdepth 1 -iname "*.html" -type f | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 1 -iname "calculator*" -type f | head -n 1)
          fi

          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" app/src/main/assets/index.html
            echo "Successfully mapped HTML source: $HTML_FILE"
          else
            echo "<html><body><h1>Calculator App</h1></body></html>" > app/src/main/assets/index.html
            echo "Warning: No calculator file found, using default stub."
          fi

          # Generate launcher icon from Icon.svg (if present)
          if [ -f "Icon.svg" ]; then
            rsvg-convert -w 48  -h 48  Icon.svg -o app/src/main/res/mipmap-mdpi/ic_launcher.png
            rsvg-convert -w 72  -h 72  Icon.svg -o app/src/main/res/mipmap-hdpi/ic_launcher.png
            rsvg-convert -w 96  -h 96  Icon.svg -o app/src/main/res/mipmap-xhdpi/ic_launcher.png
            rsvg-convert -w 144 -h 144 Icon.svg -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            rsvg-convert -w 192 -h 192 Icon.svg -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Icon generated from Icon.svg"
          else
            echo "No Icon.svg found, using default Android icon"
          fi

          cat << 'EOF' > app/src/main/java/com/smartcalculator/app/MainActivity.java
          package com.smartcalculator.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:label="Smart Calculator"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdk 34
              namespace 'com.smartcalculator.app'

              defaultConfig {
                  applicationId "com.smartcalculator.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          echo "Downloading Gradle 8.4..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH="$PWD/gradle-8.4/bin:$PATH"

          echo "Executing Gradle build..."
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
