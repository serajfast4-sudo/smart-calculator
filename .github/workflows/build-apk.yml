name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova App Environment
        run: |
          # 1. Initialize Cordova project
          cordova create build_tmp com.smartcalculator.app SmartCalculator
          cd build_tmp
          rm -rf www/*

          # 2. Locate and copy HTML file (handles 'Calculator', 'Calculator.html', or 'index.html')
          if [ -f ../index.html ]; then
            cp ../index.html www/index.html
          elif [ -f ../Calculator.html ]; then
            cp ../Calculator.html www/index.html
          elif [ -f ../Calculator ]; then
            cp ../Calculator www/index.html
          else
            echo "<html><body><h1>Calculator App</h1></body></html>" > www/index.html
          fi

          # 3. Locate and handle SVG icon (case-insensitive search)
          ICON_FILE=$(find .. -maxdepth 1 -iname "icon.svg" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" www/icon.svg
            sed -i 's|</widget>|<icon src="www/icon.svg" /></widget>|g' config.xml
          fi

          # 4. Add Android platform & build debug APK directly via Gradle
          cordova platform add android@12.0.0
          cordova build android --debug --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
